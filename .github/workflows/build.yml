name: Build WestCode

# Every run produces a fresh standalone WestCode.app (DMG + ZIP). Provider
# CLIs are not baked into the bundle — the app installs and updates them
# itself (desktop/cli-manager.mjs) — so a scheduled rebuild plus the in-app
# update banner keeps users current without a repo change per CLI release.
#
# Signed + notarized builds run when ALL these repo secrets exist
# (unsigned dev build otherwise):
#   MAC_CERT_P12          Developer ID Application cert, .p12, base64-encoded
#   MAC_CERT_PASSWORD     password for that .p12
#   APPLE_API_KEY_B64     App Store Connect API key (.p8), base64-encoded
#   APPLE_API_KEY_ID      the key's Key ID
#   APPLE_API_ISSUER      the key's Issuer ID
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly rebuild so releases pick up fresh dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build:
    needs: check
    runs-on: macos-latest
    env:
      RELEASE_READY: ${{ secrets.MAC_CERT_P12 != '' && secrets.APPLE_API_KEY_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build signed + notarized app
        if: env.RELEASE_READY == 'true'
        env:
          # electron-builder imports the cert into a temp keychain itself
          # and uploads to Apple notary via the API key env vars.
          CSC_LINK: ${{ secrets.MAC_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npm run build:desktop
          npx electron-builder --mac --publish never -c.mac.notarize=true \
            -c.directories.output=/tmp/westcode-release
          mkdir -p release
          cp /tmp/westcode-release/*.dmg /tmp/westcode-release/*.zip release/
          # electron-builder notarized the .app; the DMG needs its own
          # ticket before it can be stapled for offline Gatekeeper checks.
          xcrun notarytool submit release/*.dmg --key "$APPLE_API_KEY"             --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple release/*.dmg
      - name: Build unsigned dev app
        if: env.RELEASE_READY != 'true'
        run: |
          npm run build:desktop
          npx electron-builder --mac --publish never -c.mac.identity=null \
            -c.directories.output=/tmp/westcode-release
          mkdir -p release
          cp /tmp/westcode-release/*.dmg /tmp/westcode-release/*.zip release/
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_READY == 'true' && 'WestCode-mac' || 'WestCode-mac-unsigned' }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: env.RELEASE_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Version: every release bumps the patch above the latest v* tag.
          # A manual bump in package.json beyond that (e.g. 2.0.0) wins.
          git fetch --tags --quiet
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          BASE=$(node -p "require('./package.json').version")
          NEXT=$(LATEST="$LATEST" BASE="$BASE" node -e "
            const bump = (v) => { const p = v.split('.').map(Number); p[2] = (p[2]||0) + 1; return p.join('.'); };
            const cmp = (a, b) => { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) { if ((x[i]||0) !== (y[i]||0)) return (x[i]||0) - (y[i]||0); } return 0; };
            const latest = process.env.LATEST || '0.0.0';
            const candidate = bump(latest);
            console.log(cmp(process.env.BASE, candidate) > 0 ? process.env.BASE : candidate);
          ")
          TAG="v$NEXT"
          echo "Releasing $TAG (latest tag: v$LATEST, package.json: $BASE)"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "WestCode $NEXT" --latest --notes "Signed and notarized macOS build (arm64). Built from $GITHUB_SHA." release/*.dmg release/*.zip
