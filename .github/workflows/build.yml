name: Build WestCode

# Every run produces a fresh standalone WestCode.app (DMG + ZIP). Provider
# CLIs are not baked into the bundle — the app installs and updates them
# itself (desktop/cli-manager.mjs) — so a scheduled rebuild plus the in-app
# update banner keeps users current without a repo change per CLI release.
#
# Signed + notarized builds run when ALL these repo secrets exist
# (unsigned dev build otherwise):
#   MAC_CERT_P12          Developer ID Application cert, .p12, base64-encoded
#   MAC_CERT_PASSWORD     password for that .p12
#   APPLE_API_KEY_B64     App Store Connect API key (.p8), base64-encoded
#   APPLE_API_KEY_ID      the key's Key ID
#   APPLE_API_ISSUER      the key's Issuer ID
on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    # Weekly rebuild so releases pick up fresh dependencies.
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  build:
    needs: check
    runs-on: macos-latest
    env:
      RELEASE_READY: ${{ secrets.MAC_CERT_P12 != '' && secrets.MAC_CERT_PASSWORD != '' && secrets.APPLE_API_KEY_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compute release version
        run: |
          # Patch-bump above the latest v* tag; a higher manual version in
          # package.json wins; a rerun on an already-tagged commit reuses
          # that tag instead of minting a new one.
          git fetch --tags --quiet
          EXISTING=$(git tag -l 'v*' --points-at "$GITHUB_SHA" | sort -V | tail -1)
          LATEST=$(git tag -l 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          BASE=$(node -p "require('./package.json').version")
          if [ -n "$EXISTING" ]; then
            NEXT="${EXISTING#v}"
          else
            NEXT=$(LATEST="$LATEST" BASE="$BASE" node -e "
              const norm = (v) => String(v || '0.0.0').split('-')[0].split('.').map((n) => Number(n) || 0);
              const bump = (v) => { const p = norm(v); p[2] += 1; return p.join('.'); };
              const cmp = (a, b) => { const x = norm(a), y = norm(b); for (let i = 0; i < 3; i++) { if (x[i] !== y[i]) return x[i] - y[i]; } return 0; };
              const candidate = bump(process.env.LATEST);
              console.log(cmp(process.env.BASE, candidate) > 0 ? norm(process.env.BASE).join('.') : candidate);
            ")
          fi
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          echo "RELEASE_VERSION=$NEXT" >> "$GITHUB_ENV"
          echo "Version for this build: $NEXT (latest tag: ${LATEST:-none}, package.json: $BASE, tag at SHA: ${EXISTING:-none})"
      - name: Import Developer ID certificate
        if: env.RELEASE_READY == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          # electron-builder 26.15 creates a temp keychain then unlocks it
          # with CSC_KEY_PASSWORD. macOS 26.6 runners reject that mismatch
          # (SecKeychainUnlock: passphrase is not correct). Import into our
          # own keychain and pass only CSC_KEYCHAIN so it never creates one.
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/buildsigning.keychain-db"
          echo -n "$MAC_CERT_P12" | base64 -d > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT" -P "$MAC_CERT_PASSWORD" -A -t cert -f pkcs12 \
            -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          rm -f "$CERT"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "No Developer ID Application identity in the signing keychain"
            security find-identity -v -p codesigning "$KEYCHAIN" || true
            exit 1
          fi
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
      - name: Build signed + notarized app
        if: env.RELEASE_READY == 'true'
        env:
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "true"
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$CSC_KEYCHAIN"
          echo "${{ secrets.APPLE_API_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          npm run build:desktop
          npx electron-builder --mac --publish never -c.mac.notarize=true \
            -c.directories.output=/tmp/westcode-release
          mkdir -p release
          cp /tmp/westcode-release/*.dmg /tmp/westcode-release/*.zip release/
          # electron-builder notarized the .app; the DMG needs its own
          # ticket before it can be stapled for offline Gatekeeper checks.
          xcrun notarytool submit release/*.dmg --key "$APPLE_API_KEY"             --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple release/*.dmg
      - name: Delete signing keychain
        if: ${{ always() && env.CSC_KEYCHAIN != '' }}
        run: |
          security default-keychain -s ~/Library/Keychains/login.keychain-db || true
          security list-keychain -d user -s ~/Library/Keychains/login.keychain-db || true
          security delete-keychain "$CSC_KEYCHAIN" || true
      - name: Build unsigned dev app
        if: env.RELEASE_READY != 'true'
        run: |
          npm run build:desktop
          npx electron-builder --mac --publish never -c.mac.identity=null \
            -c.directories.output=/tmp/westcode-release
          mkdir -p release
          cp /tmp/westcode-release/*.dmg /tmp/westcode-release/*.zip release/
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_READY == 'true' && 'WestCode-mac' || 'WestCode-mac-unsigned' }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
      - name: Publish GitHub release
        if: env.RELEASE_READY == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$RELEASE_VERSION"
          echo "Releasing $TAG"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" release/*.dmg release/*.zip --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "WestCode $RELEASE_VERSION" --latest --notes "Signed and notarized macOS build (arm64). Built from $GITHUB_SHA." release/*.dmg release/*.zip
          fi
